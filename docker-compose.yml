services:
  app:
    # Single image built from the root Dockerfile: Spring Boot serves the React bundle and /api on
    # port 8081. To run the published image instead, replace `build` with `image: <namespace>/interview-board:<tag>`.
    build: .
    image: interview-board:latest
    ports:
      - "3000:8081"
    volumes:
      - data:/data
    restart: unless-stopped

volumes:
  # SQLite database. Survives `docker compose down` and rebuilds; `docker compose down -v` deletes it.
  data:
