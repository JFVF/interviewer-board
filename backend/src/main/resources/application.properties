spring.application.name=interview-board
server.port=8081

# Default (dev) profile: file-based SQLite, no setup required. Data survives restarts;
# delete the file to start fresh. SQLITE_PATH overrides the location.
spring.datasource.url=jdbc:sqlite:${SQLITE_PATH:interviewboard.db}
spring.datasource.driverClassName=org.sqlite.JDBC
# SQLite allows a single writer; one pooled connection avoids SQLITE_BUSY errors.
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
